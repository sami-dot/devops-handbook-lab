name: DevOps Handbook Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-and-secure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '0'

      - name: Build Docker image
        run: |
          docker build -t handbook-app .
          echo "Image built!"
      # NEW: Run container in background
      - name: Start container
        run: |
          docker run -d -p 8080:3000 --name my-app handbook-app
          echo "App is running on port 8080"

      # NEW: Wait for app to start
      - name: Wait for app
        run: |
          timeout 30s bash -c 'until curl -s http://localhost:8080 > /dev/null; do sleep 1; done' || echo "App failed to start"

      - name: LIVE PREVIEW IN BROWSER
        run: |
          echo ""
          echo "YOUR APP IS LIVE!"
          echo "https://${{ github.repository_owner }}-${{ github.run_number }}.githubpreview.dev"
          echo ""
          echo "Click the link above or check the job log!"
